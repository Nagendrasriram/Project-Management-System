name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: project_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/project_management?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/project_management?schema=public
      JWT_SECRET: ci-jwt-secret-testing-minimum-32-characters
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Generate Prisma Client & Migrate DB
        run: |
          npx --workspace=@project-mgmt/backend prisma generate
          npx --workspace=@project-mgmt/backend prisma db push
          npm run db:seed

      - name: Run Backend Tests
        run: npm run test:backend

      - name: Typecheck Mobile App
        run: npm run typecheck --workspace=@project-mgmt/mobile

      - name: Build Backend
        run: npm run build:backend

      - name: Build Web App
        run: npm run build:web
