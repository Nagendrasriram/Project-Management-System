name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses & Setup SDK
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Build Shared Package
        run: npm run build:shared

      - name: Expo Prebuild Android
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://project-management-api-c38i.onrender.com
        run: |
          npx expo prebuild --platform android --clean --no-install
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Standalone Release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://project-management-api-c38i.onrender.com
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || {
            echo "Release build failed, falling back to assembleDebug"
            ./gradlew assembleDebug --no-daemon --stacktrace
          }

      - name: Locate & Rename APK
        run: |
          mkdir -p build-output
          find mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TaskMatrix.apk \;
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMatrix-Android-APK
          path: build-output/TaskMatrix.apk
          retention-days: 30

      - name: Publish Direct APK Download via GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 build-output/TaskMatrix.apk \
            --title "TaskMatrix Mobile App (Android APK)" \
            --notes "Standalone Android APK for TaskMatrix Project Management System. Connected to production Render API." \
            --clobber || true
