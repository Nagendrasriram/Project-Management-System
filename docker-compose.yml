version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: project_mgmt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: project_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d project_management']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: project_mgmt_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/project_management?schema=public
      JWT_SECRET: production-secret-jwt-key-project-mgmt-min32chars!
      JWT_EXPIRES_IN: 1h
      WEB_ORIGIN: http://localhost:3000
      LOG_LEVEL: info

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: project_mgmt_web
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:80'
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  pgdata:
